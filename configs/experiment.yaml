max_new_tokens: 128
transformer:
  d_model: 256
  nhead: 4
  encoder_layers: 4
  decoder_layers: 4
  ff_dim: 1024
  dropout: 0.1
  vocab_size: 8000
  batch_size: 8
  accumulation_steps: 4
  lr: 0.0003
  epochs: 10
  patience: 2
mt5:
  model_id: google/mt5-small
  batch_size: 1
  accumulation_steps: 16
  lr: 0.0002
  epochs: 3
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
llama:
  model_id: meta-llama/Llama-3.2-1B-Instruct
gemma:
  model_id: google/gemma-3-1b-it

